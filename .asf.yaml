# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Dependency Tree"
  homepage: https://maven.apache.org/shared/maven-dependency-tree/
  labels:
    - java
    - build-management
    - maven-shared
    - maven
  protected_branches:
    master: { }
  pull_requests:
    del_branch_on_merge: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  autolink_jira:
    - MSHARED
  features:
    issues: true
notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-dependency-tree
project:
  metadata:
    key: maven-dependency-tree
    committee: maven
    name: Apache Maven Dependency Tree
    description: A tree-based API for resolution of Maven project dependencies.
    homepage: https://maven.apache.org/shared/maven-dependency-tree/
    download_page: https://maven.apache.org/shared/maven-dependency-tree/download.cgi
    bug_database: https://maven.apache.org/shared/maven-dependency-tree/issue-management.html
    mailing_lists: https://maven.apache.org/shared/maven-dependency-tree/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-dependency-tree
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-dependency-tree
    download_path_suffix: shared
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
